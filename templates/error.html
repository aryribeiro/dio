{% extends "base.html" %}

{% block title %}Erro {{ status }} — Carteira de Investimentos{% endblock %}

{% block body %}
<main class="flex justify-center items-center min-h-screen px-4">
    <div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-rose-400/20 rounded-2xl p-8 text-center shadow-[0_0_30px_rgba(244,63,94,0.1)]">
        <p class="text-5xl text-rose-400 mb-4">{{ status }}</p>
        <p class="text-white/80 mb-8">{{ message }}</p>
        <a href="/" class="inline-block px-6 py-3 bg-cyan-500/20 border border-cyan-400/30 rounded-xl text-cyan-400 hover:bg-cyan-500/30 transition-all duration-300">voltar para a carteira</a>
    </div>
</main>
{% endblock %}
